[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moneylab"
version = "0.3.0"
description = "Quantitative research and backtesting platform: preregistered, cost-aware strategy evaluation (research stage, no live trading)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "websockets>=17.2",  # sync client: `proxy=None` and `legacy=True` are used (verified on 17.2)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
moneylab = "moneylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that hit the real network (skipped by default; run with -m network)",
]
addopts = "-m 'not network'"
