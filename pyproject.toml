[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moneylab"
version = "0.1.0"
description = "Data-driven investment & prediction-market strategy research (Polymarket Scanner v0.1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
moneylab = "moneylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that hit the real network (skipped by default; run with -m network)",
]
addopts = "-m 'not network'"
