[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moneylab"
version = "0.3.0"
description = "Quantitative research and backtesting platform: preregistered, cost-aware strategy evaluation (research stage, no live trading)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "websockets>=17.2",  # sync client: `proxy=None` and `legacy=True` are used (verified on 17.2)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=2.4", "coverage>=7.17"]

[project.scripts]
moneylab = "moneylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that hit the real network (skipped by default; run with -m network)",
]
addopts = "-m 'not network'"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Required gate covers only packages with zero mypy errors at baseline. Imported modules outside
# this scope are still analyzed for types, but their own errors are not reported (debt).
[tool.mypy]
files = [
    "src/moneylab/execution",
    "src/moneylab/pnl",
    "src/moneylab/scanner",
    "src/moneylab/sizing",
]
follow_imports = "silent"

# Measurement only: no fail_under.
[tool.coverage.run]
source = ["moneylab"]
branch = true
