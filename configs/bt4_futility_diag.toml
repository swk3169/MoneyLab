# BT4-FUTILITY-01 DIAG preregistered config. Fixed at C2; any change = new study.
# Evidence class: SYNTHETIC / NOT_EVIDENCE.

[study]
id = "BT4-FUTILITY-01-DIAG"
work_order = "docs/tasks/BT4-FUTILITY-01/WORK_ORDER.md"
work_order_commit = "7ac09a674e68cbc95dd5c934f2d3580939fd02f0"
work_order_sha256 = "c1e7003788d3878c8812b8bd1dd93b5d1df28d21c01b84099225a99525bf3b8b"
work_order_blob = "bccc08b79518d2bbd2244d702ee8b2c3fa3831f9"
base_sha = "15957207a592e062aaa51a6610b7e748ce136ca0"
preregistration = "docs/research_bt4_futility_diag_preregistration.md"

[policy]
primary_alpha = 0.05
supported_fwer = 0.025
supported_multiplicity = "holm"
weakened_fwer = 0.025
weakened_multiplicity = "bonferroni"
weakened_per_hypothesis = 0.005
min_effect = 0.01
eff_rule = "max(0.01, 0.25*(r_reference - 0.05))"
exploratory_alphas = [0.025, 0.10]

[seeds]
base_seed = 20261029
derived_rule = "stats.derived_seed(base_seed, namespace, cell, str(rep), window, rule)"
namespaces = ["FUTDIAG", "FUTDIAG-PILOT", "FUTDIAG-SIGMA", "FUTDIAG-X", "FUTDIAG-TEST"]
v4_eval_parts = ["FUTDIAG", "v4eval"]
forbidden_namespaces = ["FUTVAL"]
namespace_collision = "STOP"
value_collision = "report_only"
value_collision_record = ["count_vs_mcv06", "count_within_diag", "input_tuples", "sorted_list_sha256"]

[mcv06_inputs]
run_unit = "mc_v06_full_2d6ed0a/16_normal_M60_+0p7_attempt1"
manifest_sha256 = "2025f9aace9960f14efcbef1543d3eb719124b114bef86f4fcff27c1b3b3acb2"
summary_sha256 = "f5680e8abdbaa06a77c1bd8d01b6060c76865e0261ab264c8739f6ac347fc613"
seed = 20261012
scenario = "normal_M60_+0p7"
e_cal = 0.728515625
sr_ach = 0.70007463504927
theta = 0.7
truth_years = 400

[core]
cells = ["E1-theta0.7", "P0-theta0.7"]
windows = ["conf", "f12", "f24", "f36"]
variants = ["V0", "V0d", "S1", "V0b60"]
bootstrap_b = 1999
mean_block = 20
mean_block_v3 = 60
r_min = 10000
r_max = 40000
r_round = 1000
pilot_reps_per_cell = 200
calib_years = 4000
v4_eval_years = 4000
sigma_calibration_r = 2000
target_max_mc_se_rate = 0.005
target_max_mc_se_paired = 0.0035
adaptive_stopping = "PROHIBITED"

[r_rule]
z_holm_worst = 2.575829
z_power = 0.841621
discordance_ci = "clopper_pearson_one_sided_95"
v1_discordance = "max(lo, hi)"

[v4]
target = "SR_eval - theta"
batches = 40
batch_years = 100
sensitivity_batches = 20
gamma_delta = 0.0025
gamma_sigma = 0.0025
sigma_interval = "log_asymptotic_kurtosis"
z_sigma = 3.023341
approx_max_abs_delta_over_sigma_l = 0.5

[s1_numerics]
f1_negative_tolerance_rel = 1e-12
f1_negative_action = "clamp_to_zero"
f1_below_tolerance = "STOP_IMPLEMENTATION"
f1_v0_zero = "exact_zero_required"
rd_rel = 1e-6
nd_rel = 0.25
nd_flag_share = 0.01

[degeneracy]
policy = "PD-1..PD-6"
pilot_stop_disagreement = 0.02
pilot_stop_nd_flag = 0.05
pilot_stop_sd = 0.05
evaluate_at = "G6_only"

[n1]
atol_rel_v0 = 1e-12
rtol = 1e-10
n1c_b = 200000
n1c_sigma_mult = 4

[n2]
n2a_rule = "interval_intersects"
n2a_range = [0.95, 1.05]
n2a_mc_se_mult = 3
n2a_precision_max = 0.02
n2a_b = 20000
n2a_sd_ddof = 1
n2a_exceptions = ["N2A_UNDEFINED_DENOMINATOR", "N2A_INVALID", "N2A_IMPRECISE", "N2A_FAIL"]
n2a_exception_action = "STOP_FOR_USER_DECISION"
n2b = "report_only"
n2b_quantiles = [0.01, 0.05, 0.5, 0.95, 0.99]
n2c_alpha = 0.05
n2c_r = 2000
n2c_b = 999
n2c_n = [365, 2227]
n2c_mc_se_mult = 3
n2c_rule = "unrounded alpha +/- 3*sqrt(alpha*(1-alpha)/r)"
n2c_display_range = [0.0354, 0.0646]

[budget]
core_max_walltime_hours = 96
core_max_workers = 12
core_max_worker_hours = 1152
safety_factor = 1.3
runtime_stop_multiple = 1.5

[p2]
source = "E1-theta0.7 CORE pilot M60 positions, conf window"
exclude_truncated_spells = true
mean = "pooled_arithmetic_per_state"
rounding = "round_half_up_positive_days"
transition_probability = "1/rounded_mean"
transition_range = "(0, 1]"
undefined = "P2_UNDEFINED"
invalid = "P2_INVALID"
default_substitution = false
failure_scope = "P2_EXPLORATORY_ONLY"
blocks_core_g7 = false

[exploratory]
execution = "SEPARATE_AUTHORIZATION"
reps = 5000
bootstrap_b = 1999
anchor_b = 9999
variants = ["S2", "B9999_anchor_V0"]
cells = ["P1-theta0.7", "P2-theta0.7", "E2-theta0.7", "E1-theta0.3", "P0-theta0.3", "E1-int", "E1-theta0.7-holdout914"]
excluded_from_this_study = ["data_driven_block", "S1_plus_data_driven"]
reduction_order = ["drop E2 and P1", "B = 999", "R 5000 -> 3000"]

[reporting]
path_a_estimator = "EXCLUDED"
r_hat_v0 = "descriptive_only"
evidence = "SYNTHETIC / NOT_EVIDENCE"
