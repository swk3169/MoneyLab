# Offline test suite. Mirrors the local setup in CLAUDE.md: Windows, Python 3.14,
# repo-root .venv, pinned requirements*.txt, editable install without deps, `python -m pytest`.
# pyproject.toml adds `-m 'not network'`, so tests that hit real APIs are skipped.
# No secrets, no write permissions, no research data (data/ is not in git).
# Quality gates (ruff, mypy) run once, in the required Windows job; their scope lives in pyproject.toml.
name: ci-tests

on:
  pull_request:
  push:
    branches:
      - chore/ci-tests
      - chore/ci-venv

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8" # requirements.txt: "verified on Python 3.14.8"

      # The repo-root .venv matches CLAUDE.md, and .claude/settings.json runs the guard hook with
      # ${CLAUDE_PROJECT_DIR}/.venv/Scripts/python.exe. .venv/ is git-ignored.
      - name: Create .venv
        run: python -m venv .venv

      # One command per step: the default pwsh shell only checks the exit code of the last command.
      - name: Install pinned dependencies
        run: '& .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt'

      - name: Install moneylab (editable, no deps)
        run: '& .\.venv\Scripts\python.exe -m pip install -e . --no-deps'

      - name: Lint (ruff)
        run: '& .\.venv\Scripts\python.exe -m ruff check --no-cache --select E4,E7,E9,F src tests'

      # No path arguments: files and follow_imports come from [tool.mypy] in pyproject.toml.
      - name: Type check (mypy)
        run: '& .\.venv\Scripts\python.exe -m mypy'

      # -rfEsxXp lists every test's node ID and outcome, with skip and xfail reasons, but no captured output.
      # Branch coverage of moneylab is set in [tool.coverage.run]; there is no fail-under threshold.
      - name: Run tests (under coverage)
        run: '& .\.venv\Scripts\python.exe -m coverage run -m pytest -rfEsxXp'

      - name: Coverage report
        run: '& .\.venv\Scripts\python.exe -m coverage report -m'

  # Experimental and non-blocking: shows how the suite behaves on Linux. The two agent-guard wrapper
  # tests are expected to fail here, because the hook command uses .venv/Scripts/python.exe.
  pytest-linux-experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Create .venv
        run: python -m venv .venv

      - name: Install pinned dependencies
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install moneylab (editable, no deps)
        run: .venv/bin/python -m pip install -e . --no-deps

      - name: Run tests
        run: .venv/bin/python -m pytest -rsx
